name: Security Secret Scan & Environment Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secrets-scan:
    name: Secret Leakage & Environment Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Secret Pattern Detection Test
        run: |
          node scripts/test-secret-scanner.js

      - name: Validate CI Environment Blueprint
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_testing_dummy_jwt_secret_32_bytes_minimum' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci_testing_dummy_refresh_jwt_secret_32_bytes' }}
          MONGO_URI: ${{ secrets.MONGO_URI || 'mongodb://localhost:27017/lexis_ci' }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'redis://localhost:6379' }}
          QDRANT_URL: ${{ secrets.QDRANT_URL || 'http://localhost:6333' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-ci-dummy-openai-key' }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY || 'ci-dummy-sarvam-key' }}
          SMS_PROVIDER_KEY: ${{ secrets.SMS_PROVIDER_KEY || 'ci-dummy-sms-key' }}
        run: |
          node backend/config/env.js
