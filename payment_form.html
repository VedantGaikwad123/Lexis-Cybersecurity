<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }
    .card {
      width: min(100%, 430px);
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .subtitle { color: #667085; margin: 0 0 24px; }
    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #667085; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1f2937; }
    #message { margin-top: 15px; text-align: center; font-weight: 600; }
    .demo { margin-top: 16px; font-size: 12px; color: #667085; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Payment Details</h1>
    <p class="subtitle">Enter your details to continue.</p>

    <form id="paymentForm">
      <label for="name">Cardholder Name</label>
      <input id="name" name="name" type="text" autocomplete="cc-name"
             placeholder="John Doe" required>

      <label for="card">Card Number</label>
      <input id="card" name="card" type="text" inputmode="numeric"
             autocomplete="cc-number" maxlength="19"
             placeholder="1234 5678 9012 3456" required>

      <div class="row">
        <div>
          <label for="expiry">Expiry</label>
          <input id="expiry" name="expiry" type="text" inputmode="numeric"
                 autocomplete="cc-exp" maxlength="5" placeholder="MM/YY" required>
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input id="cvv" name="cvv" type="password" inputmode="numeric"
                 autocomplete="cc-csc" maxlength="4" placeholder="123" required>
        </div>
      </div>

      <label for="amount">Amount (₹)</label>
      <input id="amount" name="amount" type="number" min="1" step="0.01"
             placeholder="1000.00" required>

      <button type="submit">Pay Now</button>
      <div id="message"></div>
      <p class="demo">Demo form only — no payment is processed or stored.</p>
    </form>
  </main>

  <script>
    const card = document.getElementById("card");
    const expiry = document.getElementById("expiry");

    card.addEventListener("input", () => {
      let v = card.value.replace(/\D/g, "").slice(0, 16);
      card.value = v.replace(/(.{4})/g, "$1 ").trim();
    });

    expiry.addEventListener("input", () => {
      let v = expiry.value.replace(/\D/g, "").slice(0, 4);
      if (v.length > 2) v = v.slice(0, 2) + "/" + v.slice(2);
      expiry.value = v;
    });

    document.getElementById("paymentForm").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("message").textContent =
        "Demo payment submitted successfully.";
    });
  </script>
</body>
</html>
