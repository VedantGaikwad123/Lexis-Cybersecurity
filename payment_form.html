<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Form</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #1f2937;
        padding: 40px 16px;
    }
    .container {
        max-width: 520px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; text-align: center; }
    .subtitle { text-align: center; color: #6b7280; margin-bottom: 25px; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input, select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        font-size: 15px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .amount {
        background: #f3f4f6;
        padding: 14px;
        border-radius: 9px;
        font-size: 18px;
        font-weight: bold;
    }
    button {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border: 0;
        border-radius: 9px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .note {
        margin-top: 18px;
        font-size: 12px;
        color: #6b7280;
        text-align: center;
        line-height: 1.5;
    }
    #message {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #dcfce7;
        color: #166534;
        text-align: center;
    }
    @media (max-width: 480px) {
        .row { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>Payment Form</h1>
    <p class="subtitle">Enter your details to complete the payment</p>

    <form id="paymentForm">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>

        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" placeholder="+91 XXXXX XXXXX" required>

        <label for="amount">Payment Amount (₹)</label>
        <input id="amount" name="amount" type="number" min="1" step="0.01" placeholder="1000" required>

        <label for="method">Payment Method</label>
        <select id="method" name="method" required>
            <option value="">Select payment method</option>
            <option>UPI</option>
            <option>Credit Card</option>
            <option>Debit Card</option>
            <option>Net Banking</option>
        </select>

        <div id="cardFields" style="display:none;">
            <label for="card">Card Number</label>
            <input id="card" type="text" inputmode="numeric" maxlength="19"
                   placeholder="XXXX XXXX XXXX XXXX">

            <div class="row">
                <div>
                    <label for="expiry">Expiry Date</label>
                    <input id="expiry" type="text" placeholder="MM/YY" maxlength="5">
                </div>
                <div>
                    <label for="cvv">CVV</label>
                    <input id="cvv" type="password" inputmode="numeric" maxlength="4" placeholder="CVV">
                </div>
            </div>
        </div>

        <button type="submit">Pay Now</button>
        <div id="message">Payment form submitted successfully (demo only).</div>

        <p class="note">
            Demo form only. No real payment is processed and card details are not sent anywhere.
            For production payments, connect this form to a PCI-compliant payment provider.
        </p>
    </form>
</div>

<script>
const method = document.getElementById("method");
const cardFields = document.getElementById("cardFields");
const form = document.getElementById("paymentForm");
const message = document.getElementById("message");

method.addEventListener("change", () => {
    const card = method.value === "Credit Card" || method.value === "Debit Card";
    cardFields.style.display = card ? "block" : "none";
});

form.addEventListener("submit", (e) => {
    e.preventDefault();
    message.style.display = "block";
});
</script>
</body>
</html>
