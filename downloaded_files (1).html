<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloaded Files</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    header {
      background: #111827;
      color: white;
      padding: 24px 40px;
    }
    header h1 { margin: 0 0 6px; font-size: 28px; }
    header p { margin: 0; color: #cbd5e1; }
    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 220px;
      padding: 12px 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-size: 15px;
    }
    button:hover { background: #1d4ed8; }
    .files {
      display: grid;
      gap: 12px;
    }
    .file {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .info {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }
    .icon {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: #eff6ff;
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .name { font-weight: 600; margin-bottom: 5px; }
    .meta { color: #6b7280; font-size: 13px; }
    .empty {
      text-align: center;
      background: white;
      padding: 50px 20px;
      border-radius: 12px;
      color: #6b7280;
    }
    footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 25px;
    }
    @media (max-width: 600px) {
      header { padding: 20px; }
      .file { align-items: flex-start; }
      .file button { padding: 9px 12px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Downloaded Files</h1>
  <p>View and manage your downloaded files.</p>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search downloaded files...">
    <button onclick="document.getElementById('search').value=''; renderFiles();">Clear Search</button>
  </div>

  <div id="files" class="files"></div>
</main>

<footer>
  Download Manager • Local HTML page
</footer>

<script>
  // Edit this list to add your own downloaded files.
  const downloadedFiles = [
    { name: "home.html", type: "HTML", size: "8 KB", date: "Today" },
    { name: "document.pdf", type: "PDF", size: "245 KB", date: "Yesterday" },
    { name: "photo.jpg", type: "Image", size: "1.2 MB", date: "18 Sep 2026" }
  ];

  function iconFor(type) {
    if (type === "HTML") return "🌐";
    if (type === "PDF") return "📄";
    if (type === "Image") return "🖼️";
    return "📁";
  }

  function renderFiles() {
    const query = document.getElementById("search").value.toLowerCase();
    const container = document.getElementById("files");

    const files = downloadedFiles.filter(file =>
      file.name.toLowerCase().includes(query) ||
      file.type.toLowerCase().includes(query)
    );

    if (!files.length) {
      container.innerHTML = '<div class="empty">No downloaded files found.</div>';
      return;
    }

    container.innerHTML = files.map(file => `
      <div class="file">
        <div class="info">
          <div class="icon">${iconFor(file.type)}</div>
          <div>
            <div class="name">${file.name}</div>
            <div class="meta">${file.type} • ${file.size} • ${file.date}</div>
          </div>
        </div>
        <button onclick="alert('Open ${file.name}')">View</button>
      </div>
    `).join("");
  }

  document.getElementById("search").addEventListener("input", renderFiles);
  renderFiles();
</script>

</body>
</html>
