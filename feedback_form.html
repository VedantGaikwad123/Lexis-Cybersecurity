<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Form</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}
.feedback-container{width:100%;max-width:500px;background:#fff;padding:35px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
h1{text-align:center;color:#333;margin-bottom:10px}.subtitle{text-align:center;color:#777;margin-bottom:25px}
.form-group{margin-bottom:20px}label{display:block;margin-bottom:8px;color:#333;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#667eea}textarea{resize:vertical;min-height:120px}
.rating{display:flex;justify-content:space-between;margin-top:10px}.rating label{cursor:pointer;font-weight:normal;text-align:center}.rating input{width:auto;margin-right:5px}
button{width:100%;padding:13px;border:0;border-radius:8px;background:#667eea;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;transition:.3s}
button:hover{background:#5568d9}.success-message{display:none;text-align:center;margin-top:20px;padding:12px;background:#d4edda;color:#155724;border-radius:8px}
</style>
</head>
<body>
<div class="feedback-container">
<h1>Feedback Form</h1>
<p class="subtitle">We'd love to hear your thoughts!</p>
<form id="feedbackForm">
<div class="form-group"><label for="name">Name</label><input type="text" id="name" name="name" placeholder="Enter your name" required></div>
<div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="Enter your email" required></div>
<div class="form-group"><label>How would you rate your experience?</label>
<div class="rating">
<label><input type="radio" name="rating" value="1" required>1</label>
<label><input type="radio" name="rating" value="2">2</label>
<label><input type="radio" name="rating" value="3">3</label>
<label><input type="radio" name="rating" value="4">4</label>
<label><input type="radio" name="rating" value="5">5</label>
</div></div>
<div class="form-group"><label for="category">Feedback Type</label>
<select id="category" name="category" required>
<option value="">Select an option</option><option>Suggestion</option><option>Complaint</option><option>Compliment</option><option>Bug Report</option><option>Other</option>
</select></div>
<div class="form-group"><label for="message">Your Feedback</label><textarea id="message" name="message" placeholder="Tell us what you think..." required></textarea></div>
<button type="submit">Submit Feedback</button>
<div class="success-message" id="successMessage">Thank you! Your feedback has been submitted successfully.</div>
</form>
</div>
<script>
document.getElementById("feedbackForm").addEventListener("submit",function(e){
e.preventDefault();
document.getElementById("successMessage").style.display="block";
this.reset();
});
</script>
</body>
</html>
